<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khu vườn hoa 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500&display=swap&subset=vietnamese" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;--card:rgba(44,16,64,.9);--btn:rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fff;--card:rgba(30,10,46,.92);--btn:rgba(255,255,255,.14)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#2a1250;color:var(--ink);font-family:'Quicksand',system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block;touch-action:manipulation}
header{position:fixed;top:0;left:0;right:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 4vh) 18px 0;pointer-events:none;text-shadow:0 2px 14px rgba(60,10,70,.7)}
.s{letter-spacing:.2em;text-transform:uppercase;font-size:clamp(11px,2.8vw,14px);opacity:.9}
h1{font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(34px,9vw,68px);margin:6px 0;line-height:1.1}
header p{margin:0 auto;max-width:520px;font-size:clamp(13px,3.4vw,17px);opacity:.95}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;cursor:pointer}
button:active{transform:scale(.96)}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:100%;text-align:center;font-size:13px;opacity:.85;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#pn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#pn.on{display:flex}
.card{background:var(--card);border-radius:22px;padding:22px;max-width:320px;width:100%;text-align:center;box-sizing:border-box}
.card h2{margin:0 0 6px;font-family:'Dancing Script',cursive;font-size:30px}
.card p{margin:6px 0 12px;font-size:13px;opacity:.85}
input{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:var(--ink);font:inherit;margin-bottom:14px}
input::placeholder{color:rgba(255,255,255,.6)}
#qr{background:#fff;display:inline-block;padding:10px;border-radius:12px;min-height:220px;min-width:220px}
#lk{font-size:11px;word-break:break-all;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <div class="s">Chúc mừng ngày 20/10</div>
  <h1 id="to">Gửi tặng những người phụ nữ tuyệt vời</h1>
  <p>Chúc bạn luôn xinh đẹp, hạnh phúc và được yêu thương mỗi ngày 🌸</p>
</header>
<div class="bar"><button id="sh">📱 Chia sẻ / QR</button></div>
<div id="pn"><div class="card">
  <h2>Tặng người đặc biệt</h2>
  <p>Nhập tên người nhận rồi quét mã QR hoặc gửi đường link.</p>
  <input id="nm" placeholder="Tên người nhận (vd: Mẹ, Linh…)" maxlength="30">
  <div id="qr"></div>
  <div id="lk"></div>
  <p style="margin-top:14px"><button id="cl">Đóng</button></p>
</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),D=Math.min(devicePixelRatio||1,2);
let W,H,t=0;
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}
rs();addEventListener('resize',rs);
const R=(a,b)=>a+Math.random()*(b-a);
const cols=[['#ff7eb6','#ffd1e8'],['#ff5e7e','#ffc2cd'],['#ffb347','#fff0b3'],['#c77dff','#eac9ff'],['#ff9ecd','#ffffff'],['#ff6f61','#ffd6c9']];
const fl=[],pt=[],stars=[],grass=[];
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:R(1,2.2),p:R(0,6),a:R(.4,1)});
for(let i=0;i<160;i++)grass.push({x:Math.random(),o:Math.random(),h:R(14,34),p:R(0,6)});
const bf=[0,1,2,3].map(i=>({p:R(0,6),s:R(.6,1.2),c:cols[i][0]}));
function plant(px,h,full){
  const cl=cols[Math.random()*cols.length|0];
  fl.push({x:px,by:H*.86+R(0,H*.09),h:h||R(H*.2,H*.46),g:full?1:0,sp:R(.005,.011),c:cl,n:5+(Math.random()*4|0),r:R(16,30),sw:R(0,6.28)});
  fl.sort((a,b)=>a.by-b.by);
}
function burst(n){for(let i=0;i<n;i++)setTimeout(()=>plant(R(30,W-30)),i*260)}
for(let i=0;i<Math.min(34,Math.round(W/38));i++)plant(R(20,W-20),null,true);
c.addEventListener('pointerdown',e=>plant(e.clientX,Math.max(H*.15,Math.min(H*.6,H*.9-e.clientY))));

function hill(y,a,col,ph){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+10;i+=10)x.lineTo(i,y+Math.sin(i*.004+ph)*a);x.lineTo(W,H);x.fill()}
function leaf(px,py,s,ang){x.save();x.translate(px,py);x.rotate(ang);x.fillStyle='#3fae6a';x.beginPath();x.ellipse(s*.5,0,s*.5,s*.2,0,0,6.283);x.fill();x.restore()}
function drawF(f){
  f.g=Math.min(1,f.g+f.sp);
  const e=1-Math.pow(1-f.g,3),top=f.by-f.h*e,sw=Math.sin(t*.0012+f.sw)*10*e,tx=f.x+sw;
  x.strokeStyle='#2e8b57';x.lineWidth=2.5+f.r*.07;x.lineCap='round';
  x.beginPath();x.moveTo(f.x,f.by);x.quadraticCurveTo(f.x-sw*.5,(f.by+top)/2,tx,top);x.stroke();
  if(e>.35){const k=.45,lx=f.x+(tx-f.x)*k,ly=f.by-(f.by-top)*k,s=f.r*1.1*e;leaf(lx,ly,s,-.6);leaf(lx,ly+f.h*.12*e,s,Math.PI+.6)}
  const b=Math.max(0,(f.g-.65)/.35),be=b*b*(3-2*b);
  f.open=be>.9;f.tx=tx;f.ty=top;
  if(be<=0){x.fillStyle=f.c[0];x.beginPath();x.arc(tx,top,4*e,0,6.283);x.fill();return}
  x.save();x.translate(tx,top);x.rotate(sw*.012);
  [[1,f.c[0]],[.62,f.c[1]]].forEach(([L,col],j)=>{
    x.fillStyle=col;
    for(let i=0;i<f.n;i++){x.save();x.rotate(i/f.n*6.283+j*.5);x.beginPath();x.ellipse(0,-f.r*L*be*.85,f.r*.46*L*be,f.r*L*be,0,0,6.283);x.globalAlpha=.93;x.fill();x.restore()}
  });
  x.globalAlpha=1;x.fillStyle='#ffd23f';x.beginPath();x.arc(0,0,f.r*.28*be,0,6.283);x.fill();
  x.fillStyle='#f39c12';x.beginPath();x.arc(0,0,f.r*.12*be,0,6.283);x.fill();
  x.restore();
}
function drawB(b){
  const px=W*(.5+.42*Math.sin(t*.00025*b.s+b.p)),py=H*(.42+.16*Math.sin(t*.0004*b.s+b.p*2)+.05*Math.sin(t*.003+b.p));
  const w=.3+.7*Math.abs(Math.sin(t*.014+b.p));
  x.save();x.translate(px,py);x.fillStyle=b.c;x.globalAlpha=.9;
  [-1,1].forEach(d=>{x.beginPath();x.ellipse(d*7*w,-3,8*w,11,d*.4,0,6.283);x.fill();x.beginPath();x.ellipse(d*5*w,7,5*w,7,-d*.4,0,6.283);x.fill()});
  x.fillStyle='#3b1c4a';x.globalAlpha=1;x.fillRect(-1.2,-8,2.4,18);x.restore();
}
function frame(){
  t=performance.now();const gy=H*.86;
  let g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1250');g.addColorStop(.45,'#b34a8a');g.addColorStop(.78,'#ffb48a');g.addColorStop(1,'#ffd9a8');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';
  stars.forEach(s=>{x.globalAlpha=Math.max(0,(.4+.6*Math.sin(t*.002+s.p))*s.a);x.fillRect(s.x*W,s.y*H*.42,s.r,s.r)});x.globalAlpha=1;
  g=x.createRadialGradient(W*.78,gy-H*.08,0,W*.78,gy-H*.08,H*.38);
  g.addColorStop(0,'rgba(255,244,210,.95)');g.addColorStop(1,'rgba(255,200,160,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  hill(gy-H*.06,H*.03,'#6a9a6e',1);hill(gy-H*.02,H*.025,'#3f8a5a',3);hill(gy+H*.02,H*.015,'#2b6e48',5);
  x.fillStyle='#235a3c';x.fillRect(0,gy+H*.05,W,H);
  x.strokeStyle='#2e8b57';x.lineWidth=2;
  grass.forEach(b=>{const bx=b.x*W,by=gy+H*.04+b.o*H*.1,sw=Math.sin(t*.002+b.p)*4;x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+sw*.5,by-b.h*.6,bx+sw,by-b.h);x.stroke()});
  fl.forEach(drawF);
  if(Math.random()<.12){const o=fl.filter(f=>f.open);if(o.length){const f=o[Math.random()*o.length|0];pt.push({x:f.tx,y:f.ty,vx:R(-.4,.4),vy:R(.3,.8),r:R(0,6),vr:R(-.05,.05),c:f.c[Math.random()<.5?0:1],s:R(5,9)})}}
  for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx+Math.sin(t*.002+i)*.4;p.y+=p.vy;p.r+=p.vr;
    if(p.y>H){pt.splice(i,1);continue}
    x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.s*.5,p.s,0,0,6.283);x.fill();x.restore()}
  bf.forEach(drawB);
  requestAnimationFrame(frame);
}
frame();

const to=document.getElementById('to'),nm=document.getElementById('nm');
function setName(n){to.textContent=n?'Gửi tặng '+n:'Gửi tặng những người phụ nữ tuyệt vời'}
try{const h=decodeURIComponent(location.hash.slice(1));if(h){nm.value=h;setName(h)}}catch(e){}
function qr(){
  const base=location.href.split('#')[0],n=nm.value.trim(),url=n?base+'#'+encodeURIComponent(n):base;
  setName(n);document.getElementById('lk').textContent=url;
  const q=document.getElementById('qr');q.innerHTML='';
  try{new QRCode(q,{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.L})}catch(e){q.textContent='Không tạo được QR'}
}
nm.oninput=qr;
document.getElementById('sh').onclick=()=>{document.getElementById('pn').classList.add('on');qr()};
document.getElementById('cl').onclick=()=>document.getElementById('pn').classList.remove('on');
</script>
</body>
</html>
